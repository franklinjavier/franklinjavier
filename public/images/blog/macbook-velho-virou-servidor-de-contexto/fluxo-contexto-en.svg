<?xml version="1.0" encoding="UTF-8"?>
<svg class="hub" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hub-title hub-desc">
<title id="hub-title">One place for context</title>
<desc id="hub-desc">The other Mac, the grok bot and the Telegram agent read and write the shared memory running on the old MacBook; the phone opens Claude Code sessions on that same MacBook.</desc>
<style>
.hub{--bg:#ffffff;--ink:#111827;--muted:#6b7280;--rule:#d1d5db;--box:#ffffff;--focal:#f3f4f6;--zone:#f9fafb}
@media (prefers-color-scheme:dark){.hub{--bg:#0b0b0c;--ink:#f3f4f6;--muted:#9ca3af;--rule:#374151;--box:#111827;--focal:#1f2937;--zone:#0f1115}}
:root.dark .hub,.dark .hub{--bg:#0b0b0c;--ink:#f3f4f6;--muted:#9ca3af;--rule:#374151;--box:#111827;--focal:#1f2937;--zone:#0f1115}
.hub text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
.hub .t{font-size:16px;font-weight:600}.hub .s{font-size:12.5px;fill:var(--muted)}
.hub .z{font:600 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;fill:var(--muted)}
.hub .cap{font-size:12.5px;fill:var(--muted)}
.hub .box{fill:var(--box);stroke:var(--rule);stroke-width:1.25}
.hub .box.f{fill:var(--focal);stroke:var(--ink);stroke-width:2}
.hub .zone{fill:var(--zone);stroke:var(--muted);stroke-width:1;stroke-dasharray:5 4}
.hub .c{fill:none;stroke:var(--muted);stroke-width:1.5}
.hub .mk{fill:var(--muted)}
</style>
<defs><marker id="hub-a" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse"><polygon class="mk" points="0 0,9 3.5,0 7"/></marker></defs>
